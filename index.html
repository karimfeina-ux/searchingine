<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          const OrigWS = window.WebSocket;
          if (OrigWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('token=')))) {
                const fake = new EventTarget();
                fake.readyState = 1;
                fake.CONNECTING = 0;
                fake.OPEN = 1;
                fake.CLOSING = 2;
                fake.CLOSED = 3;
                fake.send = function() {};
                fake.close = function() {};
                fake.onopen = null;
                fake.onclose = null;
                fake.onmessage = null;
                fake.onerror = null;
                setTimeout(function() {
                  if (typeof fake.onopen === 'function') {
                    try { fake.onopen(new Event('open')); } catch (_) {}
                  }
                  fake.dispatchEvent(new Event('open'));
                }, 5);
                return fake;
              }
              return new OrigWS(url, protocols);
            };
            try {
              window.WebSocket.prototype = OrigWS.prototype;
              window.WebSocket.CONNECTING = 0;
              window.WebSocket.OPEN = 1;
              window.WebSocket.CLOSING = 2;
              window.WebSocket.CLOSED = 3;
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
    <title>LeadHunter AI — Autonomous Business Prospecting & Intelligence Platform</title>
    <meta name="description" content="Autonomous AI business prospecting and website opportunity intelligence platform for creators and agencies." />
    <meta property="og:title" content="LeadHunter AI — Autonomous Business Prospecting & Intelligence Platform" />
    <meta property="og:description" content="Autonomous AI business prospecting and website opportunity intelligence platform for creators and agencies." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Suppress benign Vite HMR WebSocket connection errors in cloud sandbox
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('ws://') !== -1 || e.message.indexOf('wss://') !== -1)) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && typeof e.reason.message === 'string' && e.reason.message.indexOf('WebSocket') !== -1) {
          e.preventDefault && e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#0b1120] text-slate-100 antialiased selection:bg-cyan-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
